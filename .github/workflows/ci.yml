name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run package check
        run: npm run check

  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pack package
        run: npm pack --dry-run

      - name: Verify package contents
        run: |
          npm pack
          tar -tzf env-doctor-*.tgz | head -50

  # Optional: Test CLI installation
  cli-test:
    name: CLI Integration Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install package globally
        run: npm install -g .

      - name: Test CLI help
        run: env-doctor --help

      - name: Test CLI version
        run: env-doctor --version

      - name: Test CLI check with example
        run: |
          cd examples
          cp .env.example .env
          env-doctor check --strict

      - name: Test CLI JSON output
        run: |
          cd examples
          env-doctor check --json | jq .healthy

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for secrets in source
        run: |
          # This should find no real secrets (allowlist: example, dummy, test, mask, process.env, key as variable name)
          # grep returns 0 if matches found, 1 if no matches
          # We want to FAIL if any real secrets are found after filtering
          if grep -rEi "(password|secret|api[_-]?key|token)" --include="*.js" src/ test/ examples/ | \
             grep -vE "(example|dummy|test|mask|process\.env|key as|variable|key:\s|'key'|\"key\"|key=)" ; then
            echo "::error::Potential secrets found in source code"
            exit 1
          fi
          echo "No secrets detected"

      - name: Check for hardcoded credentials patterns
        run: |
          # Check for common credential patterns
          if grep -rE "(-----BEGIN|ssh-rsa|ssh-ed25519|ghp_|sk_live_|xoxb-)" --include="*.js" src/ test/ examples/ | \
             grep -v "example" ; then
            echo "::error::Hardcoded credential patterns found"
            exit 1
          fi
          echo "No hardcoded credential patterns detected"